[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pokeverse-ai"
version = "0.1.0"
description = "A learning-oriented multi-agent AI platform inspired by Pokemon"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]