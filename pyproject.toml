[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pokeverse-ai"
version = "0.1.0"
description = "A learning-oriented multi-agent AI platform inspired by Pokemon"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "typer>=0.25.1",
]

[project.scripts]
pokeverse = "pokeverse.cli:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
